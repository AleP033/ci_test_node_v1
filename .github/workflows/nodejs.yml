name: Node.Js test CI # nome workflow

# eventi
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build: # operazione del jobs
        # scleta del tipo di runner(VM)
        runs-on: ubuntu-latest
        
        strategy: # il runner fa una strategia di esecuzione su due versioni di node
            matrix: #blocco sequenziale di operazioni multiple
                node-version: [18.x, 20.x] # test del codice su entrambe le versioni

        steps:
            - uses: actions/checkout@v4 #configurazione di operazioni già stabilite su una repository online
            - name: Usa Node.Js ${{matrix.node-version}}
              uses: actions/setup-node@v4
              with: # usa Node e fa il setup(righe 21-22) sui dati della matrice(righe 23-24)
                node-version: ${{matrix.node-version}} # effettiva installazione del setup node con la versione della matrice
            - run: npm install # verifica per la ci, run del comando all'interno della bash di ubuntu
            - run: npm run build --if-present #build del pacchetto di codice se presente
            - run: npm test # una volta effettuata la build verifico con i test

    docker-build-and-push: # fratello del job build
        needs: build  # ha bisogno del primo job perchè le operazioni sono sequenziali, se la prima fallisce si blocca il processo
        runs-on: ubuntu-latest
        #la push va direttamente sul main
        if: github.ref == 'refs/heads/main' 

        steps:
            - uses: actions/checkout@v4 

            - name: Login su Docker Hub
              uses: docker/login-action@v1
              # operazioni che vanno a prendere nella sezione secrets di GitHub le credenziali
              with:
                username: ${{secrets.DOCKER_HUB_USER}}
                password: ${{secrets.DOCKER_HUB_PASS}}
            # una volta effettuato il login pusho l'immagine
            - name: Build and Push Docker Image
              uses: docker/build-push-action@v4
              with: 
                context: .
                file: Dockerfile
                push: true
                tags: aleep03/ci_test_node_v1 # dopo il login cerca l'immagine ed effettua la push dopo aver seguito le istruzioni del Dockerfile

